<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cashibra</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:linear-gradient(135deg,#ff7a00,#ffb347);
color:white;
text-align:center;
overflow:hidden;
}

/* WIGGLY LINES BACKGROUND */

body::before{
content:"";
position:absolute;
width:200%;
height:200%;
background:repeating-radial-gradient(circle at center,
rgba(255,255,255,0.08) 0px,
rgba(255,255,255,0.08) 2px,
transparent 2px,
transparent 20px);
animation:wiggle 12s linear infinite;
z-index:0;
}

@keyframes wiggle{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}

/* CONTAINER */

.container{
position:relative;
z-index:1;
padding:60px 20px;
}

/* BIRD */

.bird{
font-size:60px;
animation:float 2s ease-in-out infinite;
}

@keyframes float{
0%{transform:translateY(0);}
50%{transform:translateY(-15px);}
100%{transform:translateY(0);}
}

/* TITLE */

h1{
font-size:40px;
margin-top:10px;
}

/* DESCRIPTION */

p{
margin-top:10px;
font-size:16px;
opacity:.9;
}

/* BUTTON */

.btn{
margin-top:30px;
display:inline-block;
padding:14px 28px;
background:white;
color:#ff7a00;
border-radius:30px;
font-weight:700;
text-decoration:none;
transition:.3s;
}

.btn:hover{
transform:scale(1.1);
}

/* SMALL TAGLINE */

.tag{
margin-top:15px;
font-size:13px;
opacity:.7;
}

</style>
</head>

<body>

<div class="container">

<div class="bird">🐦</div>

<h1>Cashibra</h1>

<p>Learn money. Play smart. Build your future.</p>

<a href="learn.html" class="btn">Start Journey</a>

<div class="tag">Level up your money game ⚡</div>

</div>

</body>
</html>
