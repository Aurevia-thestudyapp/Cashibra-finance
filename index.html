<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cashibra Game</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Fredoka',sans-serif;
}

body{
background:linear-gradient(180deg,#60a5fa,#38bdf8);
color:#022c43;
}

/* TOP BAR */

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 20px;
background:white;
border-bottom:4px solid #38bdf8;
}

.logo{
font-size:22px;
font-weight:600;
}

.stats{
display:flex;
gap:10px;
}

.stat{
background:#f0f9ff;
padding:8px 14px;
border-radius:20px;
font-weight:600;
}

/* HERO */

.hero{
text-align:center;
padding:40px 20px;
}

.hero h1{
font-size:28px;
margin-bottom:10px;
}

.hero p{
font-size:16px;
opacity:.7;
}

/* GAME BUTTONS */

.menu{
padding:20px;
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
max-width:500px;
margin:auto;
}

.btn{
background:white;
padding:20px;
border-radius:18px;
text-align:center;
font-size:18px;
font-weight:600;
box-shadow:0 6px 0 #bae6fd;
cursor:pointer;
transition:.2s;
}

.btn:active{
transform:translateY(4px);
box-shadow:0 2px 0 #bae6fd;
}

/* QUESTS */

.quests{
margin-top:30px;
padding:20px;
}

.quest{
background:white;
padding:15px;
border-radius:15px;
margin-bottom:10px;
display:flex;
justify-content:space-between;
align-items:center;
}

.quest button{
background:#22c55e;
color:white;
border:none;
padding:6px 12px;
border-radius:10px;
font-weight:600;
}

/* TOAST */

#toast{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#22c55e;
color:white;
padding:10px 20px;
border-radius:10px;
display:none;
font-weight:600;
}

</style>
</head>

<body>

<!-- TOP BAR -->

<div class="topbar">

<div class="logo">💰 Cashibra</div>

<div class="stats">
<div class="stat">🪙 <span id="coins">0</span></div>
<div class="stat">🔥 <span id="streak">0</span></div>
<div class="stat">⭐ <span id="level">1</span></div>
</div>

</div>

<!-- HERO -->

<div class="hero">
<h1>Level Up Your Money Skills 🎮</h1>
<p>Play. Learn. Earn Coins.</p>
</div>

<!-- MENU -->

<div class="menu">

<div class="btn" onclick="location.href='bossbattle.html'">
⚔️ Battle
</div>

<div class="btn" onclick="location.href='learn.html'">
📚 Learn
</div>

<div class="btn">
🧠 Skills
</div>

<div class="btn">
🛒 Shop
</div>

</div>

<!-- QUESTS -->

<div class="quests">

<h3>🎯 Daily Quests</h3>

<div class="quest">
<span>Win a battle (+10)</span>
<button onclick="reward(10)">Claim</button>
</div>

<div class="quest">
<span>Learn something (+5)</span>
<button onclick="reward(5)">Claim</button>
</div>

<div class="quest">
<span>Come back tomorrow 🔒</span>
<button disabled>Locked</button>
</div>

</div>

<!-- TOAST -->

<div id="toast">+5 Coins</div>

<!-- KEEP YOUR FIREBASE SCRIPT SAME BELOW -->

<script>

// STREAK + LEVEL

function updateLevel(coins){
let level=Math.floor(coins/50)+1;
document.getElementById("level").innerText=level;
}

function updateStreak(){
let last=localStorage.getItem("lastVisit");
let today=new Date().toDateString();
let streak=localStorage.getItem("streak")||0;

if(last!==today){
streak=parseInt(streak)+1;
localStorage.setItem("streak",streak);
localStorage.setItem("lastVisit",today);
}

document.getElementById("streak").innerText=streak;
}

// TOAST

function showToast(text){
let t=document.getElementById("toast");
t.innerText=text;
t.style.display="block";
setTimeout(()=>t.style.display="none",2000);
}

</script>

</body>
</html>
