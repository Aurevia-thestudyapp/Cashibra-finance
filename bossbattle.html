```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cashibra Boss Battle</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
padding:20px;
}

/* HEADER */

header{
background:#020617;
padding:20px;
font-size:26px;
font-weight:bold;
border-bottom:2px solid #1e293b;
}

/* BOSS AREA */

.battle-area{
max-width:700px;
margin:auto;
margin-top:40px;
}

/* HP BARS */

.hp-container{
margin:20px 0;
}

.hp-label{
margin-bottom:6px;
}

.hp-bar{
height:18px;
background:#1e293b;
border-radius:10px;
overflow:hidden;
}

.hp-fill{
height:100%;
background:#ef4444;
width:100%;
transition:0.4s;
}

/* PLAYER HP */

.player .hp-fill{
background:#22c55e;
}

/* BOSS BOX */

@keyframes bossFloat{
0%{transform:translateY(0);}
50%{transform:translateY(-18px);}
100%{transform:translateY(0);}
}

.boss{
background:#ef4444;
padding:40px;
border-radius:20px;
margin:30px 0;
animation:bossFloat 1.6s infinite ease-in-out;
font-size:20px;
font-weight:bold;
}

/* QUESTION */

.question{
font-size:22px;
margin-bottom:20px;
}

/* OPTIONS */

.options{
display:flex;
flex-direction:column;
gap:12px;
}

.option{
padding:14px;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
background:#1e293b;
color:white;
transition:0.2s;
}

.option:hover{
background:#334155;
}

.correct{
background:#22c55e !important;
}

.wrong{
background:#ef4444 !important;
}

/* NEXT BUTTON */

#nextBtn{
margin-top:25px;
padding:12px 22px;
font-size:18px;
border:none;
background:#38bdf8;
color:#020617;
border-radius:8px;
cursor:pointer;
display:none;
}

/* RESULT */

.result{
font-size:26px;
margin-top:30px;
}

/* HOME */

.home-btn{
display:inline-block;
margin-top:30px;
padding:12px 20px;
background:#38bdf8;
color:#020617;
text-decoration:none;
border-radius:8px;
}

</style>
</head>

<body>

<header>
Cashibra ⚔ Boss Battle
</header>

<div class="battle-area">

<!-- PLAYER HP -->

<div class="hp-container player">
<div class="hp-label">🧑 Player HP</div>
<div class="hp-bar">
<div class="hp-fill" id="playerHP"></div>
</div>
</div>

<!-- BOSS HP -->

<div class="hp-container">
<div class="hp-label">👹 Boss HP</div>
<div class="hp-bar">
<div class="hp-fill" id="bossHP"></div>
</div>
</div>

<div class="boss">
Inflation Monster 👹
</div>

<div class="question" id="questionText"></div>

<div class="options">
<button class="option" onclick="answer(0)" id="opt0"></button>
<button class="option" onclick="answer(1)" id="opt1"></button>
<button class="option" onclick="answer(2)" id="opt2"></button>
</div>

<button id="nextBtn" onclick="nextQuestion()">Next Attack</button>

<div class="result" id="result"></div>

<a href="index.html" class="home-btn">⬅ Back Home</a>

</div>

<script>

const questions=[
{q:"What is inflation?",o:["Prices rising","Free money","Lower prices"],c:0},
{q:"Best habit for money?",o:["Saving","Gambling","Spending"],c:0},
{q:"What grows money?",o:["Investing","Shopping","Gaming"],c:0},
{q:"What is a credit score?",o:["Trust score","Height","Age"],c:0},
{q:"Safe investment?",o:["Index funds","Scams","Random coins"],c:0}
];

let current=0;

let bossHP=100;
let playerHP=100;

function updateHP(){
document.getElementById("bossHP").style.width=bossHP+"%";
document.getElementById("playerHP").style.width=playerHP+"%";
}

function loadQuestion(){

let q=questions[current];

document.getElementById("questionText").innerText=q.q;

document.getElementById("opt0").innerText=q.o[0];
document.getElementById("opt1").innerText=q.o[1];
document.getElementById("opt2").innerText=q.o[2];

document.querySelectorAll(".option").forEach(b=>{
b.disabled=false;
b.classList.remove("correct","wrong");
});

document.getElementById("nextBtn").style.display="none";

}

function answer(choice){

let q=questions[current];

document.querySelectorAll(".option").forEach(b=>b.disabled=true);

if(choice===q.c){

bossHP-=20;

document.getElementById("opt"+choice).classList.add("correct");

}else{

playerHP-=20;

document.getElementById("opt"+choice).classList.add("wrong");
document.getElementById("opt"+q.c).classList.add("correct");

}

updateHP();

if(bossHP<=0){

document.getElementById("result").innerText="🏆 You defeated the boss!";
document.querySelector(".options").style.display="none";
return;

}

if(playerHP<=0){

document.getElementById("result").innerText="💀 You lost the battle!";
document.querySelector(".options").style.display="none";
return;

}

document.getElementById("nextBtn").style.display="inline-block";

}

function nextQuestion(){

current++;

if(current>=questions.length){
current=0;
}

loadQuestion();

}

updateHP();
loadQuestion();

</script>

</body>
</html>
